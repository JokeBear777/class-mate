spring.application.name=class-mate
spring.config.import=optional:file:.env[.properties]

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

jwt.secret=${JWT_SECRET:classmate-local-development-secret-key-change-me-classmate-local-development-secret-key}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Rate Limit
rate-limit.enabled=true
rate-limit.default-limit=60
rate-limit.default-window-seconds=60
rate-limit.question.limit=3
rate-limit.question.window-seconds=10
rate-limit.feedback.limit=3
rate-limit.feedback.window-seconds=5
rate-limit.post.limit=5
rate-limit.post.window-seconds=60
rate-limit.team-recruit.limit=3
rate-limit.team-recruit.window-seconds=60
rate-limit.dashboard.limit=5
rate-limit.dashboard.window-seconds=1

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173


logging.pattern.level=%5p [traceId:%X{traceId}]
